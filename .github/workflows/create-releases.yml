name: Create version releases
on:
  push:
    branches: [main]
    paths:
      - 'releases/*.md'
      - '.github/workflows/create-releases.yml'
      - 'dist/*.exe'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create v1.0 v2.0 v2.1 releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for v in v1.0 v2.0 v2.1; do
            if gh release view "$v" >/dev/null 2>&1; then
              gh release edit "$v" --notes-file "releases/$v.md"
              echo "$v notes synced"
            else
              gh release create "$v" --title "$v" --notes-file "releases/$v.md" --target main
              echo "created $v"
            fi
          done
      - name: Refresh the v2.1 executable asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v2.1 --json assets --jq '.assets[].name' | while IFS= read -r name; do
            case "$name" in
              *.exe) gh release delete-asset v2.1 "$name" -y ;;
            esac
          done
          for f in dist/*.exe; do
            [ -e "$f" ] || continue
            gh release upload v2.1 "$f" --clobber
            echo "uploaded $f"
          done
