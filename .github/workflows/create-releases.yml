name: Create version releases
on:
  push:
    branches: [main]
    paths:
      - 'releases/*.md'
      - '.github/workflows/create-releases.yml'
      - 'dist/*.exe'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create v1.0 v2.0 v2.1 v2.2 releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for v in v1.0 v2.0 v2.1 v2.2; do
            if gh release view "$v" >/dev/null 2>&1; then
              gh release edit "$v" --notes-file "releases/$v.md"
              echo "$v notes synced"
            else
              gh release create "$v" --title "$v" --notes-file "releases/$v.md" --target main
              echo "created $v"
            fi
          done
      - name: Refresh release executables
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for v in v1.0 v2.0 v2.1 v2.2; do
            gh release view "$v" --json assets --jq '.assets[].name' | while IFS= read -r name; do
              case "$name" in *.exe) gh release delete-asset "$v" "$name" -y ;; esac
            done
          done
          for f in dist/*.exe; do
            [ -e "$f" ] || continue
            case "$f" in
              *v1.0.exe) tag=v1.0 ;;
              *v2.0.exe) tag=v2.0 ;;
              *v2.1.exe) tag=v2.1 ;;
              *v2.2.exe) tag=v2.2 ;;
              *) continue ;;
            esac
            gh release upload "$tag" "$f" --clobber
            echo "uploaded $f -> $tag"
          done

      - name: Package and upload the AI skill
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd skills
          zip -qr ../dist/pdf-seal-stamp-lite-skill.zip pdf-seal-stamp-lite
          cd ..
          gh release upload v2.2 dist/pdf-seal-stamp-lite-skill.zip --clobber
          echo "uploaded skill zip"
